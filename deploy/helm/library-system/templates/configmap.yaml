apiVersion: v1
kind: ConfigMap
metadata:
  name: library-backend-config
  namespace: {{ .Values.namespace.name }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.backend.env.springProfilesActive | quote }}
  SERVER_PORT: {{ .Values.backend.env.serverPort | quote }}
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  HIKARI_MAX_POOL_SIZE: {{ .Values.backend.env.hikariMaxPoolSize | quote }}
  CORS_ALLOWED_ORIGINS: "https://{{ (index .Values.ingress.hosts 0).host }}"
