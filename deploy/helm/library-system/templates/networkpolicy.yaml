apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: library-backend-network-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: library-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Ingress Controller and Frontend pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: library-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow outbound DNS and PostgreSQL traffic
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 5432
