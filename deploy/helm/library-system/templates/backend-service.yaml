apiVersion: v1
kind: Service
metadata:
  name: library-backend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: library-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: library-backend
