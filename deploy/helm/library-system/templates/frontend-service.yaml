apiVersion: v1
kind: Service
metadata:
  name: library-frontend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: library-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: library-frontend
